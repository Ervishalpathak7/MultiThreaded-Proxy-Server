<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 316" width="760" height="316" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><rect width="760" height="316" fill="#fff"/><text x="16" y="26" font-size="16" font-weight="600" fill="#222">Throughput by scenario</text><line x1="330.0" y1="42" x2="330.0" y2="288" stroke="#ddd"/><text x="330.0" y="304" font-size="11" fill="#666" text-anchor="middle">0</text><line x1="415.0" y1="42" x2="415.0" y2="288" stroke="#ddd"/><text x="415.0" y="304" font-size="11" fill="#666" text-anchor="middle">250k</text><line x1="500.0" y1="42" x2="500.0" y2="288" stroke="#ddd"/><text x="500.0" y="304" font-size="11" fill="#666" text-anchor="middle">500k</text><line x1="585.0" y1="42" x2="585.0" y2="288" stroke="#ddd"/><text x="585.0" y="304" font-size="11" fill="#666" text-anchor="middle">750k</text><line x1="670.0" y1="42" x2="670.0" y2="288" stroke="#ddd"/><text x="670.0" y="304" font-size="11" fill="#666" text-anchor="middle">1.00M</text><text x="320" y="65" font-size="12.5" fill="#222" text-anchor="end">Origin server, direct (no proxy)</text><rect x="330" y="52" width="50.5" height="22" rx="3" fill="#4C78A8"/><text x="386.5" y="65" font-size="12" font-weight="600" fill="#222">149k</text><text x="320" y="99" font-size="12.5" fill="#222" text-anchor="end">HTTP/1.1, cache hit</text><rect x="330" y="86" width="63.6" height="22" rx="3" fill="#4C78A8"/><text x="399.6" y="99" font-size="12" font-weight="600" fill="#222">187k</text><text x="320" y="133" font-size="12.5" fill="#222" text-anchor="end">HTTP/1.1, proxied to origin (cache off)</text><rect x="330" y="120" width="24.8" height="22" rx="3" fill="#4C78A8"/><text x="360.8" y="133" font-size="12" font-weight="600" fill="#222">73k</text><text x="320" y="167" font-size="12.5" fill="#222" text-anchor="end">HTTPS (HTTP/1.1 + TLS 1.3), cache hit</text><rect x="330" y="154" width="62.2" height="22" rx="3" fill="#4C78A8"/><text x="398.2" y="167" font-size="12" font-weight="600" fill="#222">183k</text><text x="320" y="201" font-size="12.5" fill="#222" text-anchor="end">HTTP/2 over TLS, cache hit</text><rect x="330" y="188" width="223.0" height="22" rx="3" fill="#4C78A8"/><text x="559.0" y="201" font-size="12" font-weight="600" fill="#222">656k</text><text x="320" y="235" font-size="12.5" fill="#222" text-anchor="end">HTTP/1.1, new TCP connection per request</text><rect x="330" y="222" width="11.5" height="22" rx="3" fill="#4C78A8"/><text x="347.5" y="235" font-size="12" font-weight="600" fill="#222">34k</text><text x="320" y="269" font-size="12.5" fill="#222" text-anchor="end">HTTPS, full TLS handshake per request</text><rect x="330" y="256" width="4.2" height="22" rx="3" fill="#4C78A8"/><text x="340.2" y="269" font-size="12" font-weight="600" fill="#222">12k</text><text x="744" y="26" font-size="11" fill="#666" text-anchor="end">req/s</text></svg>
