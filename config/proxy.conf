# aproxy example configuration
#
# Run two demo backends first:   ./scripts/run-backends.sh
# Generate a self-signed cert:   ./scripts/gen-certs.sh
# Start the proxy:               ./build/proxy -c config/proxy.conf

workers 0;            # 0 = one worker per CPU core
log_level info;       # debug | info | warn | error

# Plain HTTP/1.1 front door.
listen 8080;

# TLS front door: HTTP/1.1 and HTTP/2 negotiated via ALPN.
listen 8443 ssl;

# HTTP/3 over QUIC on UDP. Advertised to clients with an Alt-Svc header.
http3 8443;

ssl_certificate     certs/server.crt;
ssl_certificate_key certs/server.key;

# Per-hostname certificates selected via SNI (optional).
# tls_host example.com {
#     ssl_certificate     certs/example.crt;
#     ssl_certificate_key certs/example.key;
# }

# Request limits and timeouts.
max_header_size 16k;
max_body_size   8m;
header_timeout  10s;   # time allowed to receive the full request head
idle_timeout    60s;   # keep-alive idle time before the connection is closed

upstream backend {
    # round_robin | weighted | least_conn | ip_hash
    strategy least_conn;

    server 127.0.0.1:9001 weight=3;
    server 127.0.0.1:9002 weight=1 max_fails=3 fail_timeout=10s;

    # Active health checks: GET path every interval; 2xx/3xx = healthy.
    health_check interval=5s path=/health;

    connect_timeout 2s;
    read_timeout    30s;
    keepalive       32;    # idle connections kept per worker
}

cache {
    max_size    256m;     # total bytes of cached bodies + headers
    default_ttl 60s;      # used when the response has no max-age
    shards      16;       # independent LRU shards to reduce lock contention
}

route / {
    proxy_pass backend;
    cache on;
}

route /api {
    proxy_pass backend;
    cache off;
}
